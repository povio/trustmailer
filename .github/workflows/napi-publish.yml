name: napi-rs build & publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DEBUG: napi:*
  APP_NAME: trustmailer
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            cross: xwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: zig
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: zig
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: zig
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: zig
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: crates/trustmailer-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/trustmailer-node
          key: ${{ matrix.settings.target }}

      - name: Install zig (cross-compile via cargo-zigbuild)
        if: matrix.settings.cross == 'zig'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.settings.cross == 'zig'
        run: cargo install cargo-zigbuild --locked

      - name: Install cargo-xwin (Windows ARM64 cross-compile)
        if: matrix.settings.cross == 'xwin'
        run: cargo install cargo-xwin --locked

      - name: Install dependencies
        run: npm ci

      - name: Build (native)
        if: matrix.settings.cross == ''
        run: npm run build -- --target ${{ matrix.settings.target }}

      - name: Build (cross-compile)
        if: matrix.settings.cross != ''
        run: npm run build -- --target ${{ matrix.settings.target }} --cross-compile

      - name: Test native addon (including independent MIME parser)
        if: matrix.settings.cross == '' && matrix.settings.target != 'x86_64-apple-darwin'
        run: npm test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/trustmailer-node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-linux:
    # Linux binaries are cross-compiled with zig, so the build job cannot run them.
    # Load each one in a real Linux userland before anything is published. Tests
    # run through `docker run` because JavaScript actions cannot run inside
    # Alpine containers on ARM runners.
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            libc: gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            libc: gnu
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            libc: musl
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            libc: musl
    name: test - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/trustmailer-node

      - name: Test with Node.js on Debian Bookworm (glibc 2.36)
        if: matrix.settings.libc == 'gnu'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/crates/trustmailer-node node:24-bookworm-slim
          sh -euc 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null && npm test'

      - name: Test with Bun on Debian
        if: matrix.settings.libc == 'gnu'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/crates/trustmailer-node oven/bun:1.4.4-slim
          sh -euc 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 >/dev/null && bun run test:bun'

      - name: Test with Node.js on Alpine (musl)
        if: matrix.settings.libc == 'musl'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/crates/trustmailer-node node:24-alpine
          sh -euc 'apk add --no-cache -q python3 && npm test'

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: [build, test-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: crates/trustmailer-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: crates/trustmailer-node/artifacts

      - name: Collect binaries into the main package
        run: |
          cp artifacts/*/*.node .
          for platform in darwin-arm64 darwin-x64 win32-x64-msvc win32-arm64-msvc linux-x64-gnu linux-x64-musl linux-arm64-gnu linux-arm64-musl; do
            test -s "${APP_NAME}.${platform}.node"
          done
          ls -lh *.node

      - name: Check release version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - name: Test assembled package
        run: npm test

      - name: Publish main package with trusted publishing
        run: npm publish --access public
