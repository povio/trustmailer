[package]
name = "trustmailer-smtp"
description = "SMTP transport for trustmailer: TLS/STARTTLS, PLAIN/LOGIN/XOAUTH2 auth, connection pooling. Native runtimes only (needs raw TCP sockets)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
trustmailer-core = { workspace = true }
trustmailer-smtp-protocol = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1.0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "webpki-roots"] }
serde = { workspace = true }
tokio-socks = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
