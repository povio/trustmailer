[package]
name = "trustmailer-sendmail"
description = "Sendmail transport for trustmailer: pipes the composed message to a local sendmail-compatible binary. Native runtimes only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
trustmailer-core = { workspace = true }
async-trait = { workspace = true }
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
