[package]
name = "trustmailer-ses"
description = "Amazon SES transport for trustmailer via the SES v2 HTTPS API (SigV4), no AWS SDK dependency. Works on any runtime with an HTTP client, including WASM/browser."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
trustmailer-core = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { version = "0.3", features = ["wasm-bindgen", "formatting", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
